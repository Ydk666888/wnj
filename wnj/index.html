<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060913">
<meta name="description" content="汪楠钧 · 海南大学金融学 · 共青团员 · 学生会/入党积极分子申请 · 个人简历网站">
<title>汪楠钧 · 金融学 × AI · 个人简历</title>
<style>
/* ================= 关键CSS（全部内联） ================= */
:root{
  --p:#0a66ff; --p2:#22d3ee; --a:#8b5cf6; --a2:#ec4899; --gold:#f5a623;
  --ink:#131a2c; --muted:#5a6478; --bg:#eef1fa; --bg2:#f7f9ff;
  --card:rgba(255,255,255,.78); --card-solid:#fff; --line:rgba(18,30,80,.13);
  --glow1:rgba(10,102,255,.16); --glow2:rgba(139,92,246,.14); --glow3:rgba(34,211,238,.12);
  --shadow:0 12px 34px rgba(20,32,90,.12); --shadow-lg:0 26px 56px rgba(20,32,90,.2);
  --nav-bg:rgba(244,247,255,.8); --chipbg:rgba(10,102,255,.09);
  --r:16px; --dur:200ms; --mono:"SF Mono","JetBrains Mono",Consolas,"Courier New",monospace;
}
html[data-theme="dark"]{
  --p:#3b9dff; --p2:#22d3ee; --a:#a78bfa; --a2:#f472b6; --gold:#fbbf24;
  --ink:#e8edfb; --muted:#98a3c2; --bg:#060913; --bg2:#0b1020;
  --card:rgba(19,26,50,.72); --card-solid:#131a32; --line:rgba(140,170,255,.14);
  --glow1:rgba(59,157,255,.18); --glow2:rgba(167,139,250,.16); --glow3:rgba(34,211,238,.12);
  --shadow:0 12px 34px rgba(0,0,0,.5); --shadow-lg:0 26px 56px rgba(0,0,0,.66);
  --nav-bg:rgba(8,12,26,.74); --chipbg:rgba(59,157,255,.13);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.75;min-height:100vh;overflow-x:hidden;
  transition:background-color .3s ease,color .3s ease;
}
/* 背景光影：光斑 + 赛博网格 */
body::before{content:"";position:fixed;inset:0;z-index:-3;pointer-events:none;
  background:
    radial-gradient(620px 460px at 8% -8%,var(--glow1),transparent 62%),
    radial-gradient(560px 440px at 98% 10%,var(--glow2),transparent 60%),
    radial-gradient(760px 560px at 55% 116%,var(--glow3),transparent 66%)}
body::after{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.55;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:46px 46px;
  mask-image:radial-gradient(ellipse 95% 62% at 50% 0%,#000 0%,transparent 80%);
  -webkit-mask-image:radial-gradient(ellipse 95% 62% at 50% 0%,#000 0%,transparent 80%)}
#particles{position:fixed;inset:0;z-index:-1;pointer-events:none}
img{max-width:100%;display:block}
a{color:var(--p);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{width:min(1060px,100% - 2rem);margin-inline:auto}
section{scroll-margin-top:86px;padding:2.4rem 0 1rem}
.sec-head{display:flex;align-items:center;gap:.8rem;margin-bottom:1.4rem}
.sec-cube{width:13px;height:13px;border-radius:4px;flex:none;
  background:linear-gradient(135deg,var(--p2),var(--a));box-shadow:0 0 14px var(--p2),2px 2px 0 var(--gold)}
.sec-title{font-size:clamp(1.25rem,4vw,1.55rem);font-weight:800;letter-spacing:.5px}
.sec-sub{font-size:.8rem;color:var(--muted);margin-left:auto;font-family:var(--mono);white-space:nowrap}
.grad-text{background:linear-gradient(100deg,var(--p2),var(--a) 55%,var(--a2));
  -webkit-background-clip:text;background-clip:text;color:transparent}

/* ================= 滚动进度条 ================= */
#progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:120;
  background:linear-gradient(90deg,var(--p2),var(--a),var(--a2));
  box-shadow:0 0 12px var(--p2);transition:width .08s linear}

/* ================= 导航栏 ================= */
.nav{position:fixed;inset:0 0 auto 0;z-index:100;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  background:var(--nav-bg);border-bottom:1px solid var(--line)}
.nav.scrolled{box-shadow:0 8px 28px rgba(10,20,60,.18)}
.nav-in{display:flex;align-items:center;gap:.8rem;height:60px}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:800;letter-spacing:1px;color:var(--ink)}
.brand .logo{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;
  color:#fff;font-size:.82rem;font-family:var(--mono);
  background:linear-gradient(140deg,var(--p),var(--a));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 16px var(--glow1);
  transition:transform var(--dur) ease}
.brand:hover .logo{transform:rotate(-8deg) scale(1.08)}
.nav-links{display:none;gap:.15rem;margin-left:auto}
.nav-links a{padding:.5rem .78rem;border-radius:10px;font-size:.9rem;color:var(--muted);transition:all var(--dur) ease}
.nav-links a:hover,.nav-links a.active{color:var(--p2);
  background:linear-gradient(120deg,var(--chipbg),transparent)}
.nav-links a.active{text-shadow:0 0 18px var(--glow3)}
.nav-acts{display:flex;gap:.45rem;margin-left:auto}
.nav-links + .nav-acts{margin-left:0}
.icon-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  border:1px solid var(--line);background:var(--card);color:var(--muted);
  box-shadow:0 2px 10px rgba(10,20,60,.1);transition:all var(--dur) ease;touch-action:manipulation}
.icon-btn:hover{color:var(--p2);transform:translateY(-2px);box-shadow:0 6px 18px var(--glow1)}
.icon-btn:active{transform:scale(.93)}
.icon-btn svg{width:20px;height:20px}
.sun-ic{display:none}.moon-ic{display:block}
html[data-theme="dark"] .sun-ic{display:block}
html[data-theme="dark"] .moon-ic{display:none}
.print-btn{width:auto;padding:0 .85rem;gap:.4rem;font-size:.86rem;font-weight:700;color:#fff;border:0;
  background:linear-gradient(135deg,var(--p),var(--a));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 16px var(--glow1)}
.print-btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px var(--glow1)}

/* ================= Hero ================= */
.hero{padding:6.2rem 0 1.8rem;position:relative}
.hero-grid{display:grid;gap:1.4rem}
.hero-card{position:relative;border-radius:calc(var(--r) + 8px);padding:1.7rem 1.4rem;
  background:linear-gradient(155deg,var(--card),rgba(255,255,255,.02));
  backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.hero-card::before{content:"";position:absolute;top:-80px;right:-80px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,var(--glow2),transparent 70%)}
.hero-card::after{content:"";position:absolute;left:-70px;bottom:-90px;width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle,var(--glow3),transparent 70%)}
.hero-top{display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap}
.avatar-ring{position:relative;width:118px;height:118px;flex:none}
.avatar-ring::before{content:"";position:absolute;inset:-7px;border-radius:50%;
  background:conic-gradient(from 180deg,var(--p2),var(--a),var(--a2),var(--gold),var(--p2));
  filter:drop-shadow(0 0 12px var(--glow2));animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar-ring img,.avatar-ring .ph{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;
  border:4px solid var(--card-solid);background:var(--bg2)}
.avatar-ring .ph{display:grid;place-items:center;font-size:2.3rem;font-weight:900;color:#fff;
  background:linear-gradient(140deg,var(--p),var(--a))}
.hero-name{font-size:clamp(1.65rem,6vw,2.25rem);font-weight:900;letter-spacing:2px;line-height:1.22}
.hero-name .en{display:block;font-size:.46em;font-weight:600;letter-spacing:6px;color:var(--muted);
  font-family:var(--mono);margin-top:.2rem}
.hero-title{margin-top:.5rem;font-weight:700;color:var(--p2)}
.hero-title .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);
  margin-right:.45rem;box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 25%,transparent);
  animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px transparent}}
.hero-summary{margin-top:.9rem;color:var(--muted);max-width:640px;font-size:.95rem}
.badges{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.05rem}
.badge{display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .75rem;border-radius:999px;
  font-size:.8rem;font-weight:600;border:1px solid var(--line);background:var(--card);
  transition:all var(--dur) ease;box-shadow:0 2px 8px rgba(10,20,60,.07)}
.badge:hover{transform:translateY(-2px) scale(1.04);color:var(--p2);
  border-color:color-mix(in srgb,var(--p2) 45%,transparent);box-shadow:0 6px 16px var(--glow1)}
.badge::before{content:"";width:6px;height:6px;border-radius:2px;transform:rotate(45deg);
  background:linear-gradient(135deg,var(--p2),var(--a2));box-shadow:0 0 8px var(--p2)}
.hero-acts{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.3rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;min-height:44px;padding:.55rem 1.1rem;
  border-radius:12px;font-size:.9rem;font-weight:700;transition:all var(--dur) ease;
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  box-shadow:0 3px 10px rgba(10,20,60,.09)}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(10,20,60,.15)}
.btn:active{transform:scale(.96)}
.btn-primary{color:#fff;border:0;background:linear-gradient(135deg,var(--p),var(--a));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 20px var(--glow1)}
.btn-neon{color:var(--ink);border:1px solid color-mix(in srgb,var(--p2) 50%,transparent);
  background:linear-gradient(135deg,color-mix(in srgb,var(--p2) 14%,transparent),transparent);
  box-shadow:0 0 18px var(--glow3),inset 0 0 12px var(--glow3)}
.btn svg{width:17px;height:17px}
.side-title{font-size:.82rem;font-family:var(--mono);letter-spacing:2px;color:var(--muted);margin-bottom:.7rem}
.goals{display:flex;flex-wrap:wrap;gap:.55rem}
.goal{display:inline-flex;align-items:center;gap:.45rem;padding:.45rem .9rem;border-radius:12px;
  font-size:.84rem;font-weight:700;color:var(--a);
  background:color-mix(in srgb,var(--a) 10%,transparent);
  border:1px dashed color-mix(in srgb,var(--a) 45%,transparent);
  transition:all var(--dur) ease}
.goal:hover{transform:translateY(-2px);box-shadow:0 6px 16px var(--glow2)}
.goal::before{content:"➤";font-size:.72rem;color:var(--gold)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:200;
  padding:.6rem 1.1rem;border-radius:12px;font-size:.87rem;font-weight:600;color:#fff;
  background:linear-gradient(135deg,var(--p),var(--a));box-shadow:var(--shadow-lg);
  opacity:0;pointer-events:none;transition:all .25s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ================= 跑马灯（滚动元素） ================= */
.marquee{margin:1.9rem 0 .4rem;overflow:hidden;position:relative;
  border-block:1px solid var(--line);padding:.55rem 0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marquee-track{display:flex;gap:2.4rem;width:max-content;animation:marquee 26s linear infinite;
  font-family:var(--mono);font-size:.82rem;font-weight:700;letter-spacing:2px;white-space:nowrap}
.marquee:hover .marquee-track{animation-play-state:paused}
.marquee-track span{color:var(--muted)}
.marquee-track b{color:var(--p2)}
.marquee-track .sep{color:var(--a2)}
@keyframes marquee{to{transform:translateX(-50%)}}

/* ================= 亮点（数字滚动） ================= */
.hl-grid{display:grid;gap:.9rem;grid-template-columns:repeat(2,1fr)}
.hl-card{position:relative;padding:1.1rem 1rem;border-radius:var(--r);overflow:hidden;text-align:center;
  background:linear-gradient(165deg,var(--card),rgba(255,255,255,.02));
  border:1px solid var(--line);box-shadow:var(--shadow);
  transition:transform var(--dur) ease,box-shadow var(--dur) ease}
.hl-card:hover{transform:translateY(-5px) scale(1.02);box-shadow:var(--shadow-lg)}
.hl-card::after{content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--p2),var(--a),var(--a2));box-shadow:0 0 10px var(--p2)}
.hl-num{font-size:clamp(1.4rem,5vw,1.8rem);font-weight:900;font-family:var(--mono);letter-spacing:.5px;
  background:linear-gradient(120deg,var(--p2),var(--a) 55%,var(--a2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hl-label{font-weight:700;font-size:.88rem;margin-top:.1rem}
.hl-desc{font-size:.76rem;color:var(--muted);margin-top:.15rem}

/* ================= Tabs ================= */
.tabs{display:flex;gap:.5rem;overflow-x:auto;padding:.35rem .3rem .55rem;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:42px;padding:.5rem 1rem;border-radius:999px;font-size:.88rem;font-weight:700;
  color:var(--muted);border:1px solid var(--line);background:var(--card);
  transition:all var(--dur) ease;box-shadow:0 2px 6px rgba(10,20,60,.06)}
.tab:hover{color:var(--p2);transform:translateY(-1px)}
.tab[aria-selected="true"]{color:#fff;border-color:transparent;
  background:linear-gradient(135deg,var(--p),var(--a));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 5px 16px var(--glow1)}
.tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tab-panel[hidden]{display:none}

/* ================= 时间线 ================= */
.tl{position:relative;padding-left:1.5rem;display:grid;gap:1rem;margin-top:1rem}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;border-radius:2px;
  background:linear-gradient(180deg,var(--p2),var(--a),var(--a2),transparent)}
.tl-item{position:relative;padding:1rem 1rem;border-radius:var(--r);
  background:linear-gradient(160deg,var(--card),rgba(255,255,255,.02));
  border:1px solid var(--line);box-shadow:var(--shadow);
  transition:transform var(--dur) ease,box-shadow var(--dur) ease}
.tl-item:hover{transform:translateX(5px);box-shadow:var(--shadow-lg)}
.tl-item::before{content:"";position:absolute;left:-1.5rem;top:1.2rem;width:15px;height:15px;border-radius:50%;
  background:linear-gradient(135deg,var(--p2),var(--a));border:3px solid var(--bg);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--p2) 30%,transparent),0 0 12px var(--glow3)}
.tl-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:.4rem .65rem}
.tl-role{font-weight:800;font-size:1rem}
.tl-org{color:var(--p2);font-weight:600;font-size:.88rem}
.tl-time{margin-left:auto;font-size:.75rem;color:var(--muted);padding:.14rem .6rem;border-radius:999px;
  background:var(--chipbg);border:1px solid var(--line);font-family:var(--mono)}
.tl-list{margin:.5rem 0 0;padding-left:1.1rem;color:var(--muted);font-size:.89rem;display:grid;gap:.25rem}
.tl-list li::marker{color:var(--a2)}

/* ================= 项目卡片 ================= */
.pr-grid{display:grid;gap:1rem;grid-template-columns:1fr;margin-top:1rem}
.pr-card{position:relative;border-radius:calc(var(--r) + 2px);overflow:hidden;
  background:linear-gradient(165deg,var(--card),rgba(255,255,255,.02));
  border:1px solid var(--line);box-shadow:var(--shadow);
  transition:transform var(--dur) ease,box-shadow var(--dur) ease}
.pr-card:hover{transform:translateY(-6px) rotate(-.3deg);box-shadow:var(--shadow-lg),0 0 24px var(--glow3)}
.pr-media{position:relative;aspect-ratio:16/9;overflow:hidden;
  background:linear-gradient(140deg,#0b2a5e,#123a8f 45%,#5b3aa8 100%)}
.pr-media img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .35s ease}
.pr-card:hover .pr-media img{transform:scale(1.06)}
.pr-media .ph{display:grid;place-items:center;width:100%;height:100%;color:#fff;text-align:center;padding:1rem}
.pr-media .ph svg{width:50px;height:50px;opacity:.95;filter:drop-shadow(0 4px 12px rgba(0,0,0,.35))}
.pr-tagline{position:absolute;left:.75rem;top:.75rem;padding:.2rem .68rem;border-radius:999px;
  font-size:.7rem;font-weight:800;color:#fff;letter-spacing:1px;font-family:var(--mono);
  background:rgba(8,14,36,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.28)}
.pr-body{padding:1rem 1.05rem 1.1rem}
.pr-name{font-weight:800;font-size:1.02rem}
.pr-desc{color:var(--muted);font-size:.87rem;margin-top:.32rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.65rem}
.chip{font-size:.73rem;font-weight:700;padding:.2rem .58rem;border-radius:8px;color:var(--p2);
  background:var(--chipbg);border:1px solid color-mix(in srgb,var(--p2) 30%,transparent)}
.chip.violet{color:var(--a);background:color-mix(in srgb,var(--a) 11%,transparent);
  border-color:color-mix(in srgb,var(--a) 35%,transparent)}

/* ================= 图表（数据画像） ================= */
.chart-grid{display:grid;gap:1rem;grid-template-columns:1fr}
.chart-card{padding:1.15rem 1.1rem 1.25rem;border-radius:var(--r);
  background:linear-gradient(160deg,var(--card),rgba(255,255,255,.02));
  border:1px solid var(--line);box-shadow:var(--shadow);transition:transform var(--dur) ease}
.chart-card:hover{transform:translateY(-4px)}
.chart-title{font-weight:800;display:flex;align-items:center;gap:.5rem;font-size:.95rem}
.chart-title small{color:var(--muted);font-weight:500;font-family:var(--mono);font-size:.7rem;margin-left:auto}
.chart-card svg{width:100%;height:auto;margin-top:.9rem;display:block}
.bar-rect{transform:scaleY(0);transform-origin:bottom;transition:transform .9s cubic-bezier(.22,.8,.32,1)}
.chart-card.in .bar-rect{transform:scaleY(1)}
.line-path{stroke-dasharray:1200;stroke-dashoffset:1200;transition:stroke-dashoffset 1.6s ease}
.chart-card.in .line-path{stroke-dashoffset:0}
.line-dot{opacity:0;transition:opacity .4s ease}
.chart-card.in .line-dot{opacity:1}
.axis-txt{font-size:10px;fill:var(--muted);font-family:var(--mono)}
.grid-line{stroke:var(--line);stroke-width:1}

/* ================= 技能矩阵 ================= */
.sk-grid{display:grid;gap:1rem;grid-template-columns:1fr}
.sk-card{padding:1.1rem 1.05rem;border-radius:var(--r);
  background:linear-gradient(160deg,var(--card),rgba(255,255,255,.02));
  border:1px solid var(--line);box-shadow:var(--shadow);transition:transform var(--dur) ease}
.sk-card:hover{transform:translateY(-4px)}
.sk-head{display:flex;align-items:center;gap:.7rem;margin-bottom:.85rem}
.icon3d{width:46px;height:46px;flex:none;border-radius:13px;display:grid;place-items:center;color:#fff;
  transform-style:preserve-3d;transition:transform var(--dur) ease;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -3px 6px rgba(0,0,0,.2),0 8px 18px rgba(10,20,60,.25)}
.icon3d svg{width:22px;height:22px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.sk-card:hover .icon3d{transform:rotateX(-14deg) rotateY(12deg) translateZ(6px)}
.ic-cyan{background:linear-gradient(145deg,#22d3ee,#0e7490)}
.ic-violet{background:linear-gradient(145deg,#a78bfa,#6d28d9)}
.ic-pink{background:linear-gradient(145deg,#f472b6,#be185d)}
.ic-gold{background:linear-gradient(145deg,#fbbf24,#b45309)}
.sk-name{font-weight:800;font-size:.95rem}
.sk-cat{font-size:.72rem;color:var(--muted);font-family:var(--mono)}
.bar-row{display:grid;gap:.8rem}
.bar-item{display:grid;gap:.28rem}
.bar-top{display:flex;justify-content:space-between;font-size:.85rem;font-weight:600}
.bar-top span:last-child{color:var(--muted);font-weight:500;font-size:.76rem;font-family:var(--mono)}
.bar{height:9px;border-radius:99px;background:var(--chipbg);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--p2),var(--a) 70%,var(--a2));
  box-shadow:0 0 10px var(--glow3);transition:width 1s cubic-bezier(.22,.8,.32,1)}
.bar.in>i{width:var(--w,60%)}

/* ================= 教育与证书 ================= */

.edu-card{padding:1.1rem 1.15rem;border-radius:var(--r);border:1px solid var(--line);
  background:linear-gradient(160deg,var(--card),rgba(255,255,255,.02));
  box-shadow:var(--shadow);transition:transform var(--dur) ease}
.edu-card:hover{transform:translateY(-4px)}
.edu-top{display:flex;gap:.85rem;align-items:flex-start}
.edu-school{font-weight:800;font-size:1.05rem}
.edu-meta{color:var(--muted);font-size:.85rem;margin-top:.18rem;font-family:var(--mono)}
.edu-note{color:var(--muted);font-size:.88rem;margin-top:.5rem}
.cert-figs{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:1rem}
.cert-fig{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);
  background:var(--card-solid);box-shadow:var(--shadow);transition:transform var(--dur) ease}
.cert-fig:hover{transform:translateY(-5px) scale(1.015);box-shadow:var(--shadow-lg)}
.cert-fig .media{aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(140deg,var(--p),var(--a))}
.cert-fig img{width:100%;height:100%;object-fit:cover}
.cert-cap{padding:.65rem .9rem;font-size:.83rem;font-weight:600}
.cert-cap::before{content:"★ ";color:var(--gold)}
.traits{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.8rem}

/* ================= 兴趣爱好 ================= */
.hobby-grid{display:grid;gap:1rem;grid-template-columns:1fr}
.hobby-card{display:flex;flex-direction:column;padding:1.15rem 1.1rem;border-radius:var(--r);border:1px solid var(--line);
  background:linear-gradient(160deg,var(--card),rgba(255,255,255,.02));
  box-shadow:var(--shadow);transition:transform var(--dur) ease,box-shadow var(--dur) ease}
.hobby-card:hover{transform:translateY(-5px) rotate(-.4deg);box-shadow:var(--shadow-lg)}
.hobby-top{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem}
.hobby-name{font-weight:800;font-size:1.02rem}
.hobby-cat{color:var(--muted);font-size:.72rem;font-family:var(--mono);letter-spacing:.12em;margin-top:.15rem}
.hobby-desc{color:var(--muted);font-size:.87rem;line-height:1.65;margin:.2rem 0 .8rem}

.hobby-card:hover .icon3d{transform:rotateX(-14deg) rotateY(12deg) translateZ(6px)}
.trait{padding:.35rem .8rem;border-radius:999px;font-size:.8rem;font-weight:600;color:var(--muted);
  border:1px solid var(--line);background:var(--card);transition:all var(--dur) ease}
.trait:hover{color:var(--p2);transform:translateY(-2px)}

/* ================= 页脚 ================= */

  text-align:center;color:var(--muted);font-size:.84rem}
footer .heart{color:var(--a2)}

/* ================= 返回顶部 ================= */
.backtop{position:fixed;right:1.05rem;bottom:1.25rem;z-index:90;width:46px;height:46px;border-radius:14px;
  display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--p),var(--a));

  opacity:0;transform:translateY(14px) scale(.9);pointer-events:none;
  transition:all .25s ease;touch-action:manipulation}
.backtop.show{opacity:1;transform:none;pointer-events:auto}
.backtop:active{transform:scale(.9)}
.backtop svg{width:20px;height:20px}

/* ================= 雪花点击动效 ================= */
.fx-layer{position:fixed;inset:0;z-index:999;pointer-events:none;overflow:hidden}
.fx-ripple{position:absolute;border-radius:50%;
  border:2px solid color-mix(in srgb,var(--p2) 60%,transparent);
  animation:ripple .7s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes ripple{from{opacity:.9;transform:translate(-50%,-50%) scale(.15)}
  to{opacity:0;transform:translate(-50%,-50%) scale(1)}}
.fx-snow{position:absolute;color:var(--gold);will-change:transform,opacity;
  animation:snow .9s cubic-bezier(.16,.8,.3,1) forwards;text-shadow:0 0 10px var(--gold)}
@keyframes snow{from{opacity:1;transform:translate(-50%,-50%) scale(.4) rotate(0)}
  to{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.15) rotate(var(--rot))}}

/* ================= 进入动画 ================= */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .5s ease,transform .5s ease}
.reveal.in{opacity:1;transform:none}
.reveal[data-d="1"]{transition-delay:.07s}.reveal[data-d="2"]{transition-delay:.14s}
.reveal[data-d="3"]{transition-delay:.21s}.reveal[data-d="4"]{transition-delay:.28s}

/* ================= 响应式 ================= */
@media (min-width:720px){
  .hero-grid{grid-template-columns:1.4fr .85fr;align-items:stretch}
  .hero-card{padding:2.1rem 2.2rem}

  .sk-grid{grid-template-columns:repeat(2,1fr)}
  .hobby-grid{grid-template-columns:repeat(2,1fr)}
  .pr-grid{grid-template-columns:repeat(2,1fr)}
  .chart-grid{grid-template-columns:1fr 1fr}
}
@media (min-width:1024px){
  .pr-grid{grid-template-columns:repeat(3,1fr)}
  .nav-links{display:flex}
  .nav-acts{margin-left:.4rem}
}

/* ================= 减弱动效 ================= */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
  .reveal{opacity:1;transform:none}
  .marquee-track{animation:none}
}

/* ================= 打印 ================= */
@media print{
  @page{margin:14mm}
  body{background:#fff!important;color:#111}
  body::before,body::after,#particles,.nav,.backtop,.fx-layer,.toast,.hero-acts,.tabs,#progress,.marquee{display:none!important}
  section{padding:.55rem 0;break-inside:avoid}
  .hero{padding-top:.4rem}
  .tab-panel[hidden]{display:block!important}
  .hero-card,.hl-card,.tl-item,.pr-card,.chart-card,.sk-card,.edu-card,.cert-fig,.hobby-card{
    box-shadow:none!important;border:1px solid #ddd!important;background:#fff!important;break-inside:avoid}
  .bar>i{width:var(--w,60%)!important}
  .bar-rect{transform:none!important}.line-path{stroke-dashoffset:0!important}
  .line-dot{opacity:1!important}
  .reveal{opacity:1!important;transform:none!important}
  .hl-num,.sec-title,.grad-text{-webkit-text-fill-color:initial;color:#111!important;background:none!important}
}

/* ---- Tabs 组件（ARIA + 键盘） ---- */
function buildTabs(container, tabsData, renderPanel) {
  const tablist = el("div", "tabs");
  tablist.setAttribute("role", "tablist"); tablist.setAttribute("aria-label", "内容分类");
  tabsData.forEach((t, i) => {
    const b = el("button", "tab", esc(t.label));
    b.type = "button"; b.role = "tab"; b.id = `tab-${t.id}`;
    b.setAttribute("aria-controls", `panel-${t.id}`);
    b.setAttribute("aria-selected", i === 0 ? "true" : "false");
    b.tabIndex = i === 0 ? 0 : -1;
    tablist.appendChild(b);
  });
  container.appendChild(tablist);
  const panels = tabsData.map(t => {
    const p = el("div", "tab-panel");
    p.role = "tabpanel"; p.id = `panel-${t.id}`;
    p.setAttribute("aria-labelledby", `tab-${t.id}`); p.tabIndex = 0;
    if (t !== tabsData[0]) p.hidden = true;
    renderPanel(p, t);
    container.appendChild(p);
    return p;
  });
  const tabs = [...tablist.children];
  function activate(idx, focus) {
    tabs.forEach((b, i) => {
      const on = i === idx;
      b.setAttribute("aria-selected", on ? "true" : "false");
      b.tabIndex = on ? 0 : -1;
      panels[i].hidden = !on;
      if (on && focus) b.focus();
    });
  }
  tablist.addEventListener("click", e => {
    const i = tabs.indexOf(e.target.closest(".tab"));
    if (i > -1) activate(i);
  });
  tablist.addEventListener("keydown", e => {
    const cur = tabs.findIndex(b => b.getAttribute("aria-selected") === "true");
    let next = -1;
    if (e.key === "ArrowRight" || e.key === "ArrowDown") next = (cur + 1) % tabs.length;
    else if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = (cur - 1 + tabs.length) % tabs.length;
    else if (e.key === "Home") next = 0;
    else if (e.key === "End") next = tabs.length - 1;
    if (next > -1) { e.preventDefault(); activate(next, true); }
  });
}

(function renderCharts() {
  if (!resume.charts) return;
  const sec = section("charts", "数据画像", "// DATA PROFILE");
  const grid = el("div", "chart-grid");

  /* 柱状图 */
  if (resume.charts.bar) {
    const d = resume.charts.bar, W = 320, H = 190, pad = 26;
    const bw = (W - pad * 2) / d.data.length * 0.56;
    const gap = (W - pad * 2) / d.data.length;
    let bars = "", labels = "";
    d.data.forEach((it, i) => {
      const h = (it.v / 100) * (H - pad * 2);
      const x = pad + gap * i + (gap - bw) / 2;
      const y = H - pad - h;
      bars += `<rect class="bar-rect" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="url(#gbar)" style="transition-delay:${i * 90}ms"></rect>`;
      bars += `<text class="axis-txt" x="${(x + bw / 2).toFixed(1)}" y="${(y - 6).toFixed(1)}" text-anchor="middle">${it.v}</text>`;
      labels += `<text class="axis-txt" x="${(pad + gap * i + gap / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(it.label)}</text>`;
    });
    const card = el("div", "chart-card reveal");
    card.innerHTML = `<div class="chart-title"><span class="sec-cube" style="width:9px;height:9px"></span>${esc(d.title)}<small>${esc(d.unit || "")}</small></div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(d.title)}">
        <defs><linearGradient id="gbar" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
        ${[0, 1, 2, 3].map(i => `<line class="grid-line" x1="${pad}" x2="${W - pad}" y1="${pad + i * (H - pad * 2) / 3}" y2="${pad + i * (H - pad * 2) / 3}"></line>`).join("")}
        ${bars}${labels}</svg>`;
    grid.appendChild(card);
  }

  /* 折线图 */
  if (resume.charts.line) {
    const d = resume.charts.line, W = 320, H = 190, pad = 30;
    const max = Math.max(...d.data.map(x => x.v)) * 1.15;
    const step = (W - pad * 2) / (d.data.length - 1);
    const pts = d.data.map((it, i) => [pad + step * i, H - pad - (it.v / max) * (H - pad * 2)]);
    const path = "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L");
    const area = path + ` L${pts[pts.length - 1][0].toFixed(1)} ${H - pad} L${pad} ${H - pad} Z`;
    let dots = "", labels = "";
    d.data.forEach((it, i) => {
      dots += `<circle class="line-dot" cx="${pts[i][0].toFixed(1)}" cy="${pts[i][1].toFixed(1)}" r="3.5" fill="#fbbf24" stroke="#fff" stroke-width="1.5" style="transition-delay:${.7 + i * .12}s"></circle>`;
      dots += `<text class="axis-txt" x="${pts[i][0].toFixed(1)}" y="${(pts[i][1] - 10).toFixed(1)}" text-anchor="middle">${it.v}</text>`;
      labels += `<text class="axis-txt" x="${pts[i][0].toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(it.label)}</text>`;
    });
    const card = el("div", "chart-card reveal"); card.setAttribute("data-d", "1");
    card.innerHTML = `<div class="chart-title"><span class="sec-cube" style="width:9px;height:9px;background:linear-gradient(135deg,#fbbf24,#ec4899);box-shadow:0 0 10px #fbbf24"></span>${esc(d.title)}<small>${esc(d.unit || "")}</small></div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(d.title)}">
        <defs><linearGradient id="garea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ec4899" stop-opacity=".28"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></linearGradient></defs>
        ${[0, 1, 2, 3].map(i => `<line class="grid-line" x1="${pad}" x2="${W - pad}" y1="${pad + i * (H - pad * 2) / 3}" y2="${pad + i * (H - pad * 2) / 3}"></line>`).join("")}
        <path d="${area}" fill="url(#garea)"></path>
        <path class="line-path" d="${path}" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
        ${dots}${labels}</svg>`;
    grid.appendChild(card);
  }
  sec.appendChild(grid);

/* 导航分区高亮 */
(function spy() {
  const links = [...document.querySelectorAll(".nav-links a")];
  const map = new Map(links.map(a => [a.dataset.anchor, a]));
  const obs = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) {
      links.forEach(a => a.classList.remove("active"));
      const a = map.get(e.target.id);
      if (a) a.classList.add("active");
    }
  }), { rootMargin: "-40% 0px -54% 0px" });
  document.querySelectorAll("main section[id]").forEach(s => obs.observe(s));
})();

/* 进入视口：淡入 + 技能条 + 图表动画 + 数字滚动 */
(function reveal() {
  const fmt = n => Math.round(n);
  const obs = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    const t = e.target;
    t.classList.add("in");
    t.querySelectorAll(".hl-num[data-count]").forEach(n => {
      const target = +n.dataset.count, suffix = n.dataset.suffix || "";
      if (typeof target !== "number" || isNaN(target)) return;
      const t0 = performance.now(), dur = 900;
      (function step(now) {
        const p = Math.min(1, (now - t0) / dur);
        n.textContent = fmt(target * (1 - Math.pow(1 - p, 3))) + suffix;
        if (p < 1) requestAnimationFrame(step);
      })(t0);
    });
    obs.unobserve(t);
  }), { threshold: 0.12 });
  document.querySelectorAll(".reveal, .bar, .chart-card").forEach(n => obs.observe(n));
})();

function toast(msg) {

}

/* 雪花荡开点击动效 */
(function snowFX() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const layer = $("#fxLayer");
  const SNOWS = ["❄", "❅", "❆"];
  addEventListener("pointerdown", e => {
    if (e.target.closest("button, a, input, textarea, .tab")) return;
    const x = e.clientX, y = e.clientY;
    const rip = el("span", "fx-ripple");
    const size = 90 + Math.random() * 50;
    rip.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px`;
    layer.appendChild(rip);
    setTimeout(() => rip.remove(), 750);
    const n = 7 + Math.floor(Math.random() * 4);
    for (let i = 0; i < n; i++) {
      const s = el("span", "fx-snow", SNOWS[i % 3]);
      const ang = (Math.PI * 2 * i) / n + Math.random() * 0.6;
      const dist = 46 + Math.random() * 62;
      s.style.cssText = `left:${x}px;top:${y}px;font-size:${12 + Math.random() * 12}px;` +
        `--dx:${Math.cos(ang) * dist}px;--dy:${Math.sin(ang) * dist}px;` +
        `--rot:${Math.random() * 360 - 180}deg;animation-delay:${Math.random() * 90}ms`;
      layer.appendChild(s);
      setTimeout(() => s.remove(), 1100);
    }
  }, { passive: true });
})();

/* 粒子背景（canvas，尊重减弱动效，页面隐藏时暂停） */
(function particles() {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const cv = $("#particles");
  if (!cv || reduce) { if (cv) cv.remove(); return; }
  const ctx = cv.getContext("2d");
  let W, H, raf, running = true;
  const COLORS = ["rgba(34,211,238,", "rgba(139,92,246,", "rgba(236,72,153,", "rgba(59,157,255,"];
  let dots = [];
  function resize() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + "px"; cv.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.min(70, Math.round(W * H / 22000));
    dots = Array.from({ length: count }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .3, vy: (Math.random() - .5) * .3,
      r: 1 + Math.random() * 1.8,
      c: COLORS[Math.floor(Math.random() * COLORS.length)]
    }));
  }
  function tick() {
    if (!running) return;
    ctx.clearRect(0, 0, W, H);
    for (const d of dots) {
      d.x += d.vx; d.y += d.vy;
      if (d.x < -10) d.x = W + 10; if (d.x > W + 10) d.x = -10;
      if (d.y < -10) d.y = H + 10; if (d.y > H + 10) d.y = -10;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fillStyle = d.c + ".65)";
      ctx.fill();
    }
    /* 近距离粒子连线（赛博感） */
    for (let i = 0; i < dots.length; i++) {
      for (let j = i + 1; j < dots.length; j++) {
        const dx = dots[i].x - dots[j].x, dy = dots[i].y - dots[j].y;
        const dist2 = dx * dx + dy * dy;
        if (dist2 < 120 * 120) {
          ctx.beginPath();
          ctx.moveTo(dots[i].x, dots[i].y);
          ctx.lineTo(dots[j].x, dots[j].y);
          ctx.strokeStyle = dots[i].c + (0.12 * (1 - Math.sqrt(dist2) / 120)).toFixed(3) + ")";
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }
    raf = requestAnimationFrame(tick);
  }
  addEventListener("resize", resize, { passive: true });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { running = false; cancelAnimationFrame(raf); }
    else if (!running) { running = true; tick(); }
  });
  resize(); tick();
})();
</script>
